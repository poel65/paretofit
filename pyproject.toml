[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "poel65-paretofit"
version = "0.1.0"
description = "采集多组配置的成本与质量，算出帕累托前沿并标出被支配的选项"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "poel65" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://poel65.github.io"
Repository = "https://github.com/poel65/paretofit"
Issues = "https://github.com/poel65/paretofit/issues"

[project.scripts]
paretofit = "paretofit:main"

[tool.setuptools]
py-modules = ["paretofit"]
